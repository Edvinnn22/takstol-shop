        <div class="nav__cart">
          <button class="cart-btn" id="cartBtn">
            <svg viewBox="0 0 24 24" class="cart-icon">
              <path
                d="M6 8h12l-1 11H7L6 8zm3-2a3 3 0 016 0"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <span class="cart-count" id="cartCount">0</span>
          </button>

        <div class="nav__toggle">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </div>
  </header>

<section class="quote-page">
  <div class="container quote-page__wrapper">

    <div id="productPreview"></div>

    <form class="quote-form" id="quoteForm">
      <div class="quote-form__header">
        <h2>Begär offert</h2>
        <p>Fyll i dina uppgifter så återkommer vi med ett prisförslag.</p>
      </div>

      <div class="quote-form__grid">
        <input type="text" name="company" placeholder="Företagsnamn / Namn" required>
        <input type="email" name="email" placeholder="Email" required>
        <input type="tel" name="phone" placeholder="Telefonnummer">
        <input type="text" name="project" placeholder="Projektnamn (valfritt)">
      </div>

      <textarea name="message" placeholder="Projektdetaljer, antal takstolar, leveransönskemål..."></textarea>

      <div class="quote-form__actions">
        <button type="submit" class="btn btn--primary">Skicka förfrågan</button>
      </div>
    </form>

  </div>
</section>
